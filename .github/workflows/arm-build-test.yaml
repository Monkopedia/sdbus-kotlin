name: ARM Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsystemd-dev

      - name: ktlint + binary-compatibility check
        run: ./gradlew ktlintCheck apiCheck --stacktrace

  full-tests-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Test Dependencies
        run: |
          sudo apt-get update
          # python3-dbusmock powers the independent-peer harness (the Dbusmock* suites). Because
          # this job installs it deliberately, the test step sets DBUSMOCK_REQUIRED so a missing
          # package fails loudly instead of turning the whole foreign-peer layer into no-ops.
          # `dbus` likewise provides dbus-monitor (via dbus-bin); busctl ships with systemd on
          # ubuntu-24.04. Both are guaranteed here, hence EXTERNAL_TOOLS_REQUIRED below.
          sudo apt-get install -y libcurl4-openssl-dev libsystemd-dev dbus python3-dbusmock

      - name: Run Full Test Suite on x64
        # The JVM target now has a single backend — the owned wire connection (epic #93 retired
        # dbus-java) — so there is no separate wire-parity matrix; this runs that one backend. A
        # hard `timeout` guard ensures a hung call/signal fails fast instead of stalling (a prior
        # run hung for 21 hours).
        env:
          # This job installs python3-dbusmock above, so the harness must fail — not skip — when
          # it cannot start a dbusmock peer.
          DBUSMOCK_REQUIRED: "1"
          # busctl and dbus-monitor are guaranteed here (see the install step), and the two suites
          # that drive them — WireServeExternalTest / WireSignalEmissionExternalTest — are the only
          # proof a JVM-served object is reachable by, and a JVM-emitted signal observable from, a
          # genuinely external process (#90, #93 phases 4/3b). Without this they would skip and the
          # job would stay green if either binary vanished from the image (#229).
          EXTERNAL_TOOLS_REQUIRED: "1"
        run: |
          set -euo pipefail
          X64_SYSTEMD_LIB="$(find "${GITHUB_WORKSPACE}/libs/x86_64" -maxdepth 2 -type d -name lib | head -n 1 || true)"
          if [ -n "${X64_SYSTEMD_LIB}" ]; then
            export LD_LIBRARY_PATH="${X64_SYSTEMD_LIB}:${LD_LIBRARY_PATH:-}"
          fi

          dbus-run-session -- bash -lc '
            set -euo pipefail
            export DBUS_STARTER_BUS_TYPE=session
            export DBUS_STARTER_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}"
            export DBUS_SYSTEM_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}"
            # -Dkdbus.crossRuntimeInterop.reverse.enabled selects the native-client -> JVM-peer
            # half of CrossRuntimeInteropSmokeTest; without it those 7 cases never execute.
            timeout 1800 ./gradlew --no-daemon allTests test crossRuntimeInteropTests \
              -Dkdbus.crossRuntimeInterop.reverse.enabled=true --stacktrace
          '

      - name: Upload Failure Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-tests-x64-${{ github.run_id }}
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/tests/**
            codegen/build/test-results/**
            codegen/build/reports/tests/**
            plugin/build/test-results/**
            plugin/build/reports/tests/**
            cross_test/build/test-results/**
            cross_test/build/reports/tests/**
            stress_test/build/test-results/**
            stress_test/build/reports/tests/**

  native-build-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Native Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libsystemd-dev \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross

      - name: Build Native Test Binaries (linuxX64 and linuxArm64)
        run: |
          set -euo pipefail
          ./gradlew \
            :linkDebugTestLinuxX64 \
            :linkDebugTestLinuxArm64 \
            --stacktrace

      - name: Upload Native Test Binaries
        uses: actions/upload-artifact@v4
        with:
          name: native-test-binaries-${{ github.run_id }}
          retention-days: 14
          path: |
            build/bin/linuxX64/debugTest/test.kexe
            build/bin/linuxArm64/debugTest/test.kexe

  arm-runtime-tests:
    needs: native-build-x64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsystemd-dev dbus

      - name: Download Native Test Binaries
        uses: actions/download-artifact@v4
        with:
          name: native-test-binaries-${{ github.run_id }}
          path: .

      - name: Run linuxArm64 Native Tests
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/libs/aarch64/257.2-2/lib
        run: |
          set -euo pipefail
          TEST_BINARY="$(find . -type f -path '*/linuxArm64/debugTest/test.kexe' | head -n 1)"
          if [ -z "${TEST_BINARY}" ]; then
            echo "Could not locate linuxArm64 test binary after artifact download."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi
          chmod +x "${TEST_BINARY}"
          dbus-run-session --version

          # #219: this job is the only instrument pointed at the published linuxArm64
          # coordinate, and a `--gtest_filter` that matches nothing still exits 0 with
          # "[  PASSED  ] 0 tests." — so if this package is ever renamed, no YAML changes and
          # the suite silently becomes a no-op while the job stays green. Rather than commit a
          # second magic number that drifts the same way the package name would, derive the
          # expected counts from the binary itself: `--gtest_list_tests` ignores
          # `--gtest_filter` and always prints every test as an indented line beneath its
          # unindented class line.
          ARM_INTEGRATION_PACKAGE="com.monkopedia.sdbus.integration."
          "${TEST_BINARY}" --gtest_list_tests > arm-all-tests.txt
          TOTAL_TESTS="$(awk '/^[ ]/ { n++ } END { print n + 0 }' arm-all-tests.txt)"
          EXPECTED_INTEGRATION="$(awk -v pkg="${ARM_INTEGRATION_PACKAGE}" '
            /^[^ ]/ { cls = $0; next }
            /^[ ]/ && index(cls, pkg) == 1 { n++ }
            END { print n + 0 }
          ' arm-all-tests.txt)"
          EXPECTED_NON_INTEGRATION=$((TOTAL_TESTS - EXPECTED_INTEGRATION))
          if [ "${EXPECTED_INTEGRATION}" -eq 0 ] || [ "${EXPECTED_NON_INTEGRATION}" -eq 0 ]; then
            echo "TEST-COUNT GUARD FAILED (#219): the binary lists ${TOTAL_TESTS} tests, of which"
            echo "${EXPECTED_INTEGRATION} are under '${ARM_INTEGRATION_PACKAGE}' and ${EXPECTED_NON_INTEGRATION} are not."
            echo "Both filters below would therefore measure nothing on one side while still exiting 0."
            echo "If that package moved, update ARM_INTEGRATION_PACKAGE in this workflow to match."
            exit 1
          fi
          echo "Expecting ${EXPECTED_INTEGRATION} integration and ${EXPECTED_NON_INTEGRATION} non-integration tests (${TOTAL_TESTS} listed)."

          # Fails the step unless the runner's own summary reports exactly the count derived
          # above. Deliberately parsed with `sed -n ...p` rather than `grep`: a grep that
          # matches nothing exits 1 under `pipefail`, which would fail the job with a
          # misleading message instead of this one.
          assert_tests_ran() {
            local label="$1" expected="$2" log="$3" ran
            ran="$(sed -n 's/^\[=*\] \([0-9][0-9]*\) tests from [0-9][0-9]* test cases ran\..*$/\1/p' "${log}" | tail -n 1)"
            if [ -z "${ran}" ]; then
              echo "TEST-COUNT GUARD FAILED (#219): ${label}: the runner printed no 'N tests from M test cases ran.' summary, so there is no evidence it measured anything."
              exit 1
            fi
            if [ "${ran}" -ne "${expected}" ]; then
              echo "TEST-COUNT GUARD FAILED (#219): ${label}: ${ran} tests ran, expected ${expected} (derived from --gtest_list_tests)."
              exit 1
            fi
            echo "Test-count guard OK (#219): ${label}: ${ran} tests ran."
          }

          echo "Running non-integration suites directly on ARM"
          "${TEST_BINARY}" "--gtest_filter=*-${ARM_INTEGRATION_PACKAGE}*" | tee arm-non-integration.log
          assert_tests_ran "non-integration suites" "${EXPECTED_NON_INTEGRATION}" arm-non-integration.log

          echo "Running integration suites on ARM inside dbus-run-session"
          export TEST_BINARY
          export ARM_INTEGRATION_FILTER="${ARM_INTEGRATION_PACKAGE}*"
          dbus-run-session -- bash -lc '
            set -euo pipefail
            export DBUS_STARTER_BUS_TYPE=session
            export DBUS_STARTER_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}"
            export DBUS_SYSTEM_BUS_ADDRESS="${DBUS_SESSION_BUS_ADDRESS}"
            "${TEST_BINARY}" "--gtest_filter=${ARM_INTEGRATION_FILTER}"
          ' | tee arm-integration.log
          assert_tests_ran "integration suites" "${EXPECTED_INTEGRATION}" arm-integration.log

      - name: Upload Failure Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arm-build-test-${{ github.run_id }}
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/tests/**
            codegen/build/test-results/**
            codegen/build/reports/tests/**
            plugin/build/test-results/**
            plugin/build/reports/tests/**
            cross_test/build/test-results/**
            cross_test/build/reports/tests/**
            stress_test/build/test-results/**
            stress_test/build/reports/tests/**
