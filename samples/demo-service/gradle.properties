kotlin.code.style=official

# Mirrors the root build's setting, and is required rather than cosmetic: each sample is the *root*
# of its own composite build, so only this file configures the Gradle daemon that the Kotlin/Native
# compiler runs inside. Without it the daemon takes Gradle's defaults (-Xmx512m and, the one that
# actually bites, -XX:MaxMetaspaceSize=384m) and the native link dies with
# `java.lang.OutOfMemoryError: Metaspace`. Setting org.gradle.jvmargs replaces the defaults
# wholesale, which is what lifts the metaspace cap.
org.gradle.jvmargs=-Xmx4096m
